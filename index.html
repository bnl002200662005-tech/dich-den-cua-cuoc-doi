      localStorage.setItem("thy_notes", JSON.stringify(state.notes));
      localStorage.setItem("thy_secret_reply", state.secretReply);
      localStorage.setItem("thy_secret_msg", state.secretCustomMsg);
      localStorage.setItem("thy_rating", String(state.rating));
      localStorage.setItem("long_email", state.longEmail);
      localStorage.setItem("thy_custom_images", JSON.stringify(state.customImages));
    }

    function getImgSrc(keyOrBase) {
      if (state.customImages[keyOrBase]) return state.customImages[keyOrBase];
      const base = DEFAULT_IMAGES[keyOrBase] || keyOrBase;
      if (base.startsWith("http") || base.startsWith("data:")) return base;
      return `${base}.jpeg`;
    }

    function imgFallbackAttr(keyOrBase) {
      const base = DEFAULT_IMAGES[keyOrBase] || keyOrBase;
      return `onerror="if(!this.dataset.triedJpg){this.dataset.triedJpg='1';this.src='${base}.jpg';}else{this.style.display='none';}"`;
    }

    function triggerFireworks(emojis = ["✨", "💖", "🎉", "🌸", "💫", "🥰"]) {
      for (let i = 0; i < 22; i++) {
        setTimeout(() => {
          const el = document.createElement("div");
          el.className = "floating-emoji";
          el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = Math.floor(8 + Math.random() * 84) + "vw";
          el.style.fontSize = Math.floor(20 + Math.random() * 14) + "px";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 2300);
        }, i * 75);
      }
    }

    function getRatingFeedback(val) {
      if (val >= 90) return { title: "Đỉnh nóc kịch trần 👑", desc: "Đỉnh nóc kịch trần luôn! Nghe câu này xong chắc anh Long cười tủm tỉm từ giờ tới cuối tuần mất thôi ✨" };
      if (val >= 70) return { title: "Rất ưng ý luôn nha 🌸", desc: "Cảm ơn Thy đã dành thời gian khám phá góc nhỏ này cùng anh Long!" };
      if (val >= 40) return { title: "Cũng dễ thương phết đó 😊", desc: "Anh Long sẽ cố gắng ghi điểm thêm nhiều hơn nữa ở những buổi gặp sau!" };
      return { title: "Cần cố gắng thêm rồi 🙈", desc: "Anh Long xin ghi nhận góp ý để lần tới làm Thy hài lòng hơn nha!" };
    }

    function handleLogoTap() {
      state.logoClicks += 1;
      if (state.logoClicks >= 5) {
        state.logoClicks = 0;
        state.screen = "admin";
        render();
      }
    }

    function toggleItem(itemId) {
      state.selected[itemId] = !state.selected[itemId];
      saveState();
      render();
    }

    function updateNote(secId, value) {
      state.notes[secId] = value;
      saveState();
    }

    function pickRandomVoucher() {
      const idx = Math.floor(Math.random() * VOUCHER_LIST.length);
      return VOUCHER_LIST[idx];
    }

    async function submitResultsToLong() {
      if (state.submitting) return;
      state.submitting = true;
      render();

      const chosenList = [];
      SECTIONS.forEach(sec => {
        const picked = sec.items.filter(it => state.selected[it.id]).map(it => it.title);
        const note = (state.notes[sec.id] || "").trim();
        if (picked.length || note) {
          chosenList.push(`${sec.title}: ${picked.join(", ") || "(Không tick)"}${note ? " | Ghi chú: " + note : ""}`);
        }
      });

      const replyObj = REPLY_OPTIONS.find(r => r.id === state.secretReply);
      const voucher = pickRandomVoucher();

      const payload = {
        _subject: "💌 Kết quả hành trình tìm hiểu từ Thy gửi anh Long!",
        _captcha: "false",
        _template: "table",
        "1_Muc_do_hai_long": `${state.rating}% (${getRatingFeedback(state.rating).title})`,
        "2_Hoi_dap_Yeu_Duoc_Khong": replyObj ? `${replyObj.label} — Lời nhắn: ${state.secretCustomMsg || "(Không có)"}` : (state.secretCustomMsg || "Chưa chọn"),
        "3_Voucher_Thy_Nhan_Duoc": `[${voucher.code}] ${voucher.title} — ${voucher.desc}`,
        "4_So_thich_chi_tiet": chosenList.length ? chosenList.join("\n") : "Thy chưa chọn mục nào"
      };

      try {
        await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(state.longEmail)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.warn("FormSubmit notice:", e);
      }

      state.submitting = false;
      state.submittedDone = true;
      state.voucherModal = voucher;
      render();
      triggerFireworks(["🎉", "💖", "🎁", "✨", "🌸", "🥳", "💫"]);
    }

                ${(selectedReplyObj || state.secretCustomMsg.trim()) ? `
                  <div class="mt-3 p-3 rounded-xl bg-white border border-[#F2C6CF]">
                    <div class="text-[10px] font-bold uppercase tracking-wider text-[#C85A68]">💌 Hồi đáp của Thy dành cho câu hỏi “Yêu Được Không?”</div>
                    ${selectedReplyObj ? `<div class="text-xs font-bold text-[#3A322C] mt-1">${selectedReplyObj.label} — <span class="font-normal text-[#6E6259]">${selectedReplyObj.reaction}</span></div>` : ''}
                    ${state.secretCustomMsg.trim() ? `<div class="text-xs text-[#5C4F46] mt-1 italic">“${state.secretCustomMsg.trim()}”</div>` : ''}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>

          <!-- THANH TRƯỢT ĐÁNH GIÁ & GỬI KẾT QUẢ -->
          <div class="rounded-3xl bg-[#FFFDF9] border border-[#EAE0D5] p-5 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-1">
              <h3 class="font-bold text-sm text-[#3A322C]">📊 Thy chấm cho góc nhỏ này bao nhiêu % hài lòng?</h3>
              <span class="text-base font-extrabold text-[#C85A68]">${state.rating}%</span>
            </div>
            <p class="text-xs text-[#7A6E65] mb-4">Kéo thanh trượt từ 0% đến 100% để xem phản ứng tương ứng nha</p>

            <input type="range" min="0" max="100" value="${state.rating}"
              oninput="state.rating=Number(this.value);saveState();render()" />

            <div class="mt-4 p-3.5 rounded-2xl bg-[#FAF6F0] border border-[#EAE0D5] flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl overflow-hidden bg-[#E8DFD5] shrink-0">
                <img src="${getImgSrc('avatar')}" ${imgFallbackAttr('avatar')} alt="Anh Long" class="w-full h-full object-cover" />
              </div>
              <div>
                <div class="font-bold text-xs text-[#3A322C]">${fb.title}</div>
                <div class="text-xs text-[#6E6259] mt-0.5 leading-relaxed">${fb.desc}</div>
              </div>
            </div>

            <button onclick="submitResultsToLong()" ${state.submitting ? 'disabled' : ''}
              class="mt-5 w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-[#C85A68] to-[#D96B79] hover:opacity-95 text-white font-bold text-sm shadow-lg shadow-[#C85A68]/30 transition">
              ${state.submitting ? 'Đang gửi kết quả & mở quà bất ngờ...' : 'Hoàn thành & Gửi kết quả về cho Long 💌'}
            </button>
          </div>
        </main>
        ${renderVoucherModal()}
      `;
    }

    function renderVoucherModal() {
      if (!state.voucherModal) return "";
      const v = state.voucherModal;
      return `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="voucher-pop w-full max-w-sm rounded-3xl bg-[#FAF6F0] p-5 shadow-2xl border border-[#EAE0D5] text-center">
            <span class="inline-block px-3.5 py-1 rounded-full bg-[#EFE6D8] text-[#6E5D4F] text-[11px] font-bold tracking-wider uppercase mb-3">
              🎉 Quà tặng bất ngờ dành riêng cho Thy
            </span>

            <div class="rounded-2xl border-2 border-dashed border-[#D8A7AE] bg-[#FFFDF9] p-5">
              <div class="text-4xl mb-2">${v.icon}</div>
              <span class="inline-block px-3 py-1 rounded-full bg-[#4A413A] text-[#FAF6F0] text-[11px] font-bold tracking-wider">
                MÃ: ${v.code}
              </span>
              <h3 class="font-serif-editorial text-2xl font-bold text-[#3A322C] mt-3 leading-snug">
                ${v.title}
              </h3>
              <p class="text-xs text-[#5C4F46] mt-2 leading-relaxed">
                ${v.desc}
              </p>
              <div class="mt-3 pt-3 border-t border-[#EFE5DC] text-[11px] font-semibold text-[#B57B45]">
                ✨ Hiệu lực: ${v.validity}
              </div>
            </div>

            <p class="text-xs text-[#6E6259] mt-3 leading-relaxed">
              Chụp màn hình chiếc vé xinh này lại để “đòi nợ” anh Long bất cứ lúc nào nha người đẹp! 💓
            </p>

            <button onclick="state.voucherModal=null;render();triggerFireworks(['💖','✨','🎉'])"
              class="mt-4 w-full py-3.5 px-6 rounded-2xl bg-[#C85A68] hover:bg-[#B54B59] text-white font-bold text-sm shadow-md transition">
              Nhận quà liền ✨
            </button>
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      const imageSlots = [
        { key: "avatar", label: "Ảnh đại diện Trang Chào Mừng" },
        { key: "banner_welcome", label: "Ảnh đầu trang Góc Dạo Đầu" },
        { key: "banner_p1", label: "Ảnh đầu trang Phần 1 (Thức uống)" },
        { key: "banner_p2", label: "Ảnh đầu trang Phần 2 (Âm nhạc)" },
        { key: "banner_p3", label: "Ảnh đầu trang Phần 3 (Điện ảnh)" },
        { key: "banner_p4", label: "Ảnh đầu trang Phần 4 (Món ngon)" },
        { key: "banner_p5", label: "Ảnh đầu trang Phần 5 (Boss thú cưng)" },
        { key: "banner_p6", label: "Ảnh đầu trang Phần 6 (Đẹp & Thơm)" },
        { key: "banner_p7", label: "Ảnh đầu trang Phần 7 (Gifts & Chill)" },
        { key: "paris", label: "Ảnh Nhà thờ Đức Bà Paris" }
      ];

      return `
        ${renderHeader("Góc của Long")}
        <main class="max-w-xl mx-auto px-4 pt-5 pb-20 animate-fade-up">
          <div class="rounded-3xl bg-[#FFFDF9] border border-[#EAE0D5] p-5 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-4">
              <div>
                <h2 class="font-serif-editorial text-2xl font-bold text-[#3A322C]">⚙️ Góc của Long</h2>
                <p class="text-xs text-[#7A6E65]">Quản lý ảnh, email nhận kết quả và reset dữ liệu</p>
              </div>
              <button onclick="state.screen='welcome';render()"
                class="px-4 py-2 rounded-xl bg-[#C85A68] text-white text-xs font-bold shadow">
                ✓ Lưu & Quay lại
              </button>
            </div>

            <div class="flex gap-2 mb-4">
              <button onclick="state.adminTab='images';render()"
                class="flex-1 py-2 rounded-xl text-xs font-bold ${state.adminTab==='images' ? 'bg-[#3A322C] text-white' : 'bg-[#F5EFE6] text-[#6E6259]'}">
                🖼️ Ảnh Hiển Thị
              </button>
              <button onclick="state.adminTab='email';render()"
                class="flex-1 py-2 rounded-xl text-xs font-bold ${state.adminTab==='email' ? 'bg-[#3A322C] text-white' : 'bg-[#F5EFE6] text-[#6E6259]'}">
                📧 Email & Reset
              </button>
            </div>

            ${state.adminTab === 'images' ? `
              <div class="space-y-3">
                ${imageSlots.map(slot => `
                  <div class="flex items-center gap-3 p-3 rounded-2xl bg-[#FAF6F0] border border-[#EAE0D5]">
                    <img src="${getImgSrc(slot.key)}" ${imgFallbackAttr(slot.key)} alt="${slot.label}"
                      class="w-16 h-12 rounded-xl object-cover bg-[#E8DFD5] shrink-0" />
                    <div class="flex-1 min-w-0">
                      <div class="text-xs font-bold text-[#3A322C] truncate">${slot.label}</div>
                      <input type="text" value="${state.customImages[slot.key] || ''}"
                        onchange="state.customImages['${slot.key}']=this.value.trim();saveState();render()"
                        placeholder="Dán link ảnh https://... (để trống dùng ảnh GitHub)"
                        class="mt-1 w-full rounded-lg bg-white border border-[#E5D9CC] px-2.5 py-1 text-[11px] text-[#3A322C]" />
                    </div>
                  </div>
                `).join("")}
              </div>
            ` : `
              <div class="space-y-4">
                <div class="p-4 rounded-2xl bg-[#FAF6F0] border border-[#EAE0D5]">
                  <label class="block text-xs font-bold text-[#3A322C] mb-1">📧 Địa chỉ Email nhận kết quả của Long:</label>
                  <input type="email" value="${state.longEmail}"
                    oninput="state.longEmail=this.value.trim();saveState()"
                    class="w-full rounded-xl bg-white border border-[#E5D9CC] px-3 py-2 text-xs text-[#3A322C]" />
                </div>

                <div class="p-4 rounded-2xl bg-[#FFF5F7] border border-[#F3D1D8]">
                  <div class="text-xs font-bold text-[#C85A68] mb-1">🔄 Đặt lại dữ liệu thử nghiệm</div>
                  <p class="text-xs text-[#6E6259] mb-3">Xóa hết các lựa chọn đã tick thử để bắt đầu lại từ Trang Chào Mừng.</p>
                  <button onclick="if(confirm('Xóa toàn bộ lựa chọn thử nghiệm và quay về Trang Chào Mừng?')){localStorage.clear();location.reload();}"
                    class="w-full py-2.5 rounded-xl bg-[#C85A68] text-white text-xs font-bold">
                    Xóa hết lựa chọn & reset về ban đầu
                  </button>
                </div>
              </div>
            `}
          </div>
        </main>
      `;
    }

    function render() {
      const app = document.getElementById("app");
      if (state.screen === "welcome") app.innerHTML = renderWelcome();
      else if (state.screen === "sections") app.innerHTML = renderSection();
      else if (state.screen === "secret") app.innerHTML = renderSecret();
      else if (state.screen === "admin") app.innerHTML = renderAdmin();
    }

    render();
  </script>
</body>
</html>
